ttom:-20%;right:-8%;width:40vw;height:40vw;border-radius:50%;background:#d8f3ec;opacity:.5;z-index:0;\">\u003C/div>\n  \u003Cdiv style=\"position:absolute;top:54%;left:-6%;width:16vw;height:16vw;border-radius:50%;background:#e7e3fb;opacity:.5;z-index:0;\">\u003C/div>\n\n  \u003C!-- hangul soft tiles -->\n  \u003Csc-if value=\"{{ showJamo }}\" hint-placeholder-val=\"{{ true }}\">\n    \u003Cdiv style=\"--r:-8deg;position:absolute;top:17%;left:8%;width:clamp(64px,8.4vw,108px);height:clamp(64px,8.4vw,108px);border-radius:24px;background:#6a5ae0;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(106,90,224,.30);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Jua',sans-serif;font-size:clamp(34px,4.5vw,58px);line-height:1;animation:glm_float 4.6s ease-in-out infinite;z-index:3;\">ㄱ\u003C/div>\n    \u003Cdiv style=\"--r:7deg;position:absolute;top:47%;left:16%;width:clamp(52px,6.8vw,88px);height:clamp(52px,6.8vw,88px);border-radius:20px;background:#ffd6dd;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(106,90,224,.18);display:flex;align-items:center;justify-content:center;color:#2e2566;font-family:'Jua',sans-serif;font-size:clamp(28px,3.8vw,48px);line-height:1;animation:glm_float 5.2s .6s ease-in-out infinite;z-index:3;\">ㅏ\u003C/div>\n    \u003Cdiv style=\"--r:-5deg;position:absolute;top:71%;left:11%;width:clamp(56px,7.2vw,94px);height:clamp(56px,7.2vw,94px);border-radius:22px;background:#ff8a3d;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(255,138,61,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Jua',sans-serif;font-size:clamp(30px,4vw,50px);line-height:1;animation:glm_float 4.9s 1s ease-in-out infinite;z-index:3;\">ㄷ\u003C/div>\n    \u003Cdiv style=\"--r:7deg;position:absolute;top:15%;right:8%;width:clamp(60px,8vw,102px);height:clamp(60px,8vw,102px);border-radius:24px;background:#c4d0fb;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(106,90,224,.22);display:flex;align-items:center;justify-content:center;color:#2e2566;font-family:'Jua',sans-serif;font-size:clamp(32px,4.3vw,54px);line-height:1;animation:glm_float 5.4s .3s ease-in-out infinite;z-index:3;\">ㅂ\u003C/div>\n    \u003Cdiv style=\"--r:-6deg;position:absolute;top:46%;right:15%;width:clamp(52px,6.8vw,86px);height:clamp(52px,6.8vw,86px);border-radius:20px;background:#c9f2e9;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(54,201,138,.20);display:flex;align-items:center;justify-content:center;color:#2e2566;font-family:'Jua',sans-serif;font-size:clamp(28px,3.8vw,46px);line-height:1;animation:glm_float 4.7s .9s ease-in-out infinite;z-index:3;\">ㅁ\u003C/div>\n    \u003Cdiv style=\"--r:5deg;position:absolute;top:70%;right:10%;width:clamp(56px,7.2vw,94px);height:clamp(56px,7.2vw,94px);border-radius:22px;background:#3fc46e;border:3px solid #2e2566;box-shadow:0 14px 24px rgba(63,196,110,.26);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Jua',sans-serif;font-size:clamp(30px,4vw,50px);line-height:1;animation:glm_float 5.1s .2s ease-in-out infinite;z-index:3;\">ㅅ\u003C/div>\n  \u003C/sc-if>\n\n  \u003C!-- logo + tagline -->\n  \u003Cdiv style=\"position:absolute;top:24%;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;\">\n    \u003Cdiv style=\"position:relative;animation:glm_logo 3.4s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(106,90,224,.30)) drop-shadow(0 12px 14px rgba(106,90,224,.20));\">\n      \u003Cdiv style=\"position:relative;animation:glm_pop .7s .05s both;\">\n        \u003Cdiv style=\"position:absolute;top:0;left:0;width:100%;text-align:center;white-space:nowrap;font-family:'Jua',sans-serif;font-size:clamp(78px,12.5vw,168px);line-height:1;letter-spacing:-1px;-webkit-text-stroke:9px #6a5ae0;color:#6a5ae0;paint-order:stroke fill;\">글림\u003C/div>\n        \u003Cdiv style=\"position:absolute;top:0;left:0;width:100%;text-align:center;white-space:nowrap;font-family:'Jua',sans-serif;font-size:clamp(78px,12.5vw,168px);line-height:1;letter-spacing:-1px;-webkit-text-stroke:5px #fff;color:#fff;paint-order:stroke fill;\">글림\u003C/div>\n        \u003Cdiv style=\"position:relative;text-align:center;white-space:nowrap;font-family:'Jua',sans-serif;font-size:clamp(78px,12.5vw,168px);line-height:1;letter-spacing:-1px;\">\u003Cspan style=\"color:#3fc46e;\">글\u003C/span>\u003Cspan style=\"color:#ff7a3d;\">림\u003C/span>\u003C/div>\n      \u003C/div>\n    \u003C/div>\n    \u003Cdiv style=\"margin-top:clamp(18px,2.4vw,30px);font-family:'Dongle',sans-serif;color:#6e6a90;font-size:clamp(20px,2.6vw,32px);letter-spacing:.3px;animation:glm_rise .6s .35s both;\">한글이 즐거워지는 곳\u003C/div>\n  \u003C/div>\n\n  \u003C!-- stage widget -->\n  \u003Cdiv style=\"position:absolute;top:64%;left:50%;transform:translateX(-50%);z-index:11;width:clamp(280px,42vw,460px);display:flex;flex-direction:column;align-items:center;\">\n\n    \u003Csc-if value=\"{{ isSplash }}\" hint-placeholder-val=\"{{ true }}\">\n      \u003Cdiv style=\"display:inline-flex;align-items:center;gap:13px;animation:glm_fade .4s both;\">\n        \u003Cspan style=\"font-family:'Dongle',sans-serif;color:#6e6a90;font-size:clamp(18px,2.1vw,24px);\">출발 준비 중\u003C/span>\n        \u003Cspan style=\"display:inline-flex;gap:8px;\">\n          \u003Cspan style=\"width:12px;height:12px;border-radius:50%;background:#6a5ae0;animation:glm_dot 1.2s 0s ease-in-out infinite;\">\u003C/span>\n          \u003Cspan style=\"width:12px;height:12px;border-radius:50%;background:#ff8a3d;animation:glm_dot 1.2s .18s ease-in-out infinite;\">\u003C/span>\n          \u003Cspan style=\"width:12px;height:12px;border-radius:50%;background:#3fc46e;animation:glm_dot 1.2s .36s ease-in-out infinite;\">\u003C/span>\n        \u003C/span>\n      \u003C/div>\n    \u003C/sc-if>\n\n    \u003Csc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      \u003Cdiv style=\"width:100%;animation:glm_fade .4s both;display:flex;flex-direction:column;align-items:center;\">\n        \u003Cdiv style=\"width:100%;height:14px;background:#e4e1f7;border-radius:999px;overflow:hidden;\">\n          \u003Cdiv style=\"height:100%;width:{{ pctStr }};background:linear-gradient(90deg,#6a5ae0,#9087e5);border-radius:999px;transition:width .12s linear;\">\u003C/div>\n        \u003C/div>\n        \u003Cdiv style=\"display:flex;align-items:center;gap:9px;margin-top:16px;\">\n          \u003Cspan style=\"font-family:'Dongle',sans-serif;color:#6e6a90;font-size:clamp(17px,1.9vw,23px);\">{{ tipText }}\u003C/span>\n          \u003Cspan style=\"font-family:'Dongle',sans-serif;color:#6a5ae0;font-size:clamp(16px,1.8vw,21px);\">{{ pct }}%\u003C/span>\n        \u003C/div>\n      \u003C/div>\n    \u003C/sc-if>\n\n    \u003Csc-if value=\"{{ isReady }}\" hint-placeholder-val=\"{{ false }}\">\n      \u003Cbutton onClick=\"{{ start }}\" style=\"cursor:pointer;border:none;background:#6a5ae0;color:#fff;font-family:'Jua',sans-serif;font-size:clamp(20px,2.7vw,32px);padding:clamp(14px,1.9vw,21px) clamp(44px,6vw,74px);border-radius:22px;box-shadow:0 16px 28px rgba(106,90,224,.45);animation:glm_btn 1.4s ease-in-out infinite;\">시작하기\u003C/button>\n    \u003C/sc-if>\n\n  \u003C/div>\n\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;loadingSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;동작&quot;},&quot;autoLoop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;동작&quot;},&quot;showJamo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;장면&quot;}}\">\nclass Component extends DCLogic {\n  tips = [\n    '받침은 글자의 발이래요',\n    '천천히 또박또박 읽어요',\n    '소리 내어 따라 읽어요',\n    '오늘도 한글과 친해져요',\n    '한 글자씩 차근차근',\n  ];\n  state = { stage:'splash', pct:0, tip:0 };\n\n  componentDidMount(){ this.timers=[]; this.runSequence(); }\n  componentWillUnmount(){ this.clearAll(); }\n  clearAll(){ (this.timers||[]).forEach(t=>{clearTimeout(t);clearInterval(t);}); this.timers=[]; }\n\n  runSequence(){\n    this.clearAll();\n    this.setState({stage:'splash',pct:0,tip:0});\n    this.timers.push(setTimeout(()=>this.startLoading(),2100));\n  }\n  startLoading(){\n    this.setState({stage:'loading',pct:0,tip:0});\n    const sp=Math.max(0.3,this.props.loadingSpeed??1), inc=1.5*sp;\n    const iv=setInterval(()=>{\n      this.setState(s=>{\n        let np=s.pct+inc*(0.7+Math.random()*0.6);\n        if(np>=100){np=100;clearInterval(iv);this.timers.push(setTimeout(()=>this.finish(),480));}\n        return {pct:np};\n      });\n    },70);\n    this.timers.push(iv);\n    const ti=setInterval(()=>this.setState(s=>({tip:(s.tip+1)%this.tips.length})),1500);\n    this.timers.push(ti);\n  }\n  finish(){\n    this.clearAll();\n    this.setState({stage:'ready',pct:100});\n    if(this.props.autoLoop){ this.timers.push(setTimeout(()=>this.runSequence(),2400)); }\n  }\n\n  renderVals(){\n    const st=this.state.stage;\n    return {\n      isSplash:st==='splash', isLoading:st==='loading', isReady:st==='ready',\n      pct:Math.round(this.state.pct), pctStr:this.state.pct+'%',\n      tipText:this.tips[this.state.tip]||this.tips[0],\n      showJamo:this.props.showJamo??true,\n      replay:()=>this.runSequence(),\n      start:this.props.onStart || (()=>this.runSequence()),\n    };\n  }\n}\n\u003C/script>\n\u003C/body>\n\u003C/html>\n","글림 홈화면.dc.html":"\u003C!DOCTYPE html>\n\u003Chtml>\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003Cscript src=\"./support.js\">\u003C/script>\n\u003Ctemplate id=\"__bundler_thumbnail\" data-bg-color=\"#f1effc\">\n  \u003Csvg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003Crect x=\"300\" y=\"250\" width=\"600\" height=\"300\" rx=\"60\" fill=\"#6a5ae0\"/>\n    \u003Ccircle cx=\"470\" cy=\"430\" r=\"46\" fill=\"#ffd24b\"/>\n    \u003Crect x=\"560\" y=\"320\" width=\"120\" height=\"48\" rx=\"24\" fill=\"#ffd24b\"/>\n    \u003Crect x=\"560\" y=\"400\" width=\"260\" height=\"40\" rx=\"20\" fill=\"#ffffff\" opacity=\"0.5\"/>\n    \u003Ctext x=\"600\" y=\"660\" font-family=\"sans-serif\" font-weight=\"900\" font-size=\"120\" text-anchor=\"middle\" fill=\"#6a5ae0\">글림\u003C/text>\n  \u003C/svg>\n\u003C/template>\n\u003C/head>\n\u003Cbody>\n\u003Cx-dc>\n\u003Chelmet>\n\u003Clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003Clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003Clink href=\"https://fonts.googleapis.com/css2?family=Dongle&family=Jua&display=swap\" rel=\"stylesheet\">\n\u003Cstyle>\n  html,body{margin:0;padding:0;min-height:100%;background:#f1effc;-webkit-tap-highlight-color:transparent;}\n  *{box-sizing:border-box;}\n  @keyframes glm_fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes glm_drive{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}\n  @keyframes glm_wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(16deg)}}\n  @keyframes glm_play{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}\n  @keyframes glm_gate{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}}\n  @keyframes glm_wheel{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n  @keyframes glm_dash{from{background-position:0 0}to{background-position:46px 0}}\n\u003C/style>\n\u003C/helmet>\n\u003Cdiv style=\"position:relative;width:100%;min-height:100vh;overflow-x:hidden;font-family:'Dongle',sans-serif;background:radial-gradient(120% 80% at 85% -10% Total = window.GLIM_M ? GLIM_M.STAGES.length : 10;\n    const w = info(this.props.progWord, wTotal), sy = info(this.props.progSyl, 10), ph = info(this.props.progPho, 10);\n    return {\n      wordPct: w.pct, wordLabel: w.label,\n      sylPct: sy.pct, sylLabel: sy.label,\n      phoPct: ph.pct, phoLabel: ph.label,\n      onWord: this.props.onWord || (()=>{}),\n      onSyllable: this.props.onSyllable || (()=>{}),\n      onPhoneme: this.props.onPhoneme || (()=>{}),\n      onAnimal: this.props.onAnimal || (()=>{}),\n      onBack: this.props.onBack || (()=>{}),\n    };\n  }\n}\n\u003C/script>\n\u003C/body>\n\u003C/html>\n","글림 동물선택.dc.html":"\u003C!DOCTYPE html>\n\u003Chtml>\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003Cscript src=\"./support.js\">\u003C/script>\n\u003C/head>\n\u003Cbody>\n\u003Cx-dc>\n\u003Chelmet>\n\u003Clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003Clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003Clink href=\"https://fonts.googleapis.com/css2?family=Dongle&family=Jua&display=swap\" rel=\"stylesheet\">\n\u003Cstyle>\n  html,body{margin:0;padding:0;min-height:100%;background:#6a5ae0;-webkit-tap-highlight-color:transparent;}\n  *{box-sizing:border-box;}\n  @keyframes glm_fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes glm_walk{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg)}50%{transform:translateX(-50%) translateY(-7px) rotate(2deg)}}\n  @keyframes glm_spot{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}\n  @keyframes glm_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}\n  @keyframes glm_kick{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(12deg)}}\n\n\u003C/style>\n\u003C/helmet>\n\u003Cdiv style=\"position:relative;width:100%;min-height:100vh;overflow-x:hi nect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003Clink href=\"https://fonts.googleapis.com/css2?family=Dongle&family=Jua&display=swap\" rel=\"stylesheet\">\n\u003Cstyle>\n  html,body{margin:0;padding:0;min-height:100%;background:#6a5ae0;-webkit-tap-highlight-color:transparent;}\n  *{box-sizing:border-box;}\n  @keyframes glm_fadein{from{opacity:0}to{opacity:1}}\n  @keyframes glm_stage_glow{0%,100%{box-shadow:0 8px 18px rgba(0,0,0,.28),0 0 0 5px rgba(255,255,255,.4)}50%{box-shadow:0 8px 18px rgba(0,0,0,.28),0 0 0 13px rgba(255,255,255,0)}}\n\u003C/style>\n\u003C/helmet>\n\u003Cdiv style=\"position:relative;width:100%;min-height:100vh;overflow:hidden;font-family:'Dongle',sans-serif;background:{{ bg }};\">\n\n  \u003Csvg width=\"0\" height=\"0\" style=\"position:absolute;\" aria-hidden=\"true\">\u003Cdefs>\n    \u003ClinearGradient id=\"glmGold\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003Cstop offset=\"0\" stop-color=\"#fff3cf\"/>\u003Cstop offset=\".5\" stop-color=\"#ffd87e\"/>\u003Cstop offset=\"1\" stop-color=\"#fbb84f\"/>\u003C/linearGradient>\n    \u003ClinearGradient id=\"glmGrey\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003Cstop offset=\"0\" stop-color=\"#d8d4e6\"/>\u003Cstop offset=\".5\" stop-color=\"#b3aec8\"/>\u003Cstop offset=\"1\" stop-color=\"#928da8\"/>\u003C/linearGradient>\n    \u003CclipPath id=\"glmStarClip\">\u003Cpath d=\"M12 1.9c.6 0 1.15.34 1.42.88l2.3 4.66 5.14.75c.6.09 1.1.51 1.29 1.08.18.58.03 1.21-.41 1.63l-3.72 3.62.88 5.12c.1.6-.15 1.21-.65 1.57-.5.36-1.16.4-1.7.12L12 19.55l-4.6 2.42c-.54.28-1.2.24-1.7-.12-.5-.36-.75-.97-.65-1.57l.88-5.12-3.72-3.62c-.44-.42-.59-1.05-.41-1.63.19-.57.69-.99 1.29-1.08l5.14-.75 2.3-4.66c.27-.54.82-.88 1.42-.88z\"/>\u003C/clipPath>\n  \u003C/defs>\u003C/svg>\n  \u003Cdiv style=\"position:absolute;top:-12%;right:-5%;width:34vw;height:34vw;border-radius:50%;background:rgba(255,255,255,.08);z-index:0;\">\u003C/div>\n  \u003Cdiv style=\"position:absolute;bottom:-16%;left:-7%;width:30vw;height:30vw;border-radius:50%;background:rgba(0,0,0,.07);z-index:0;\">\u003C/div>\n\n  \u003C!-- top bar -->\n  \u003Cdiv style=\"position:absolute;top:clamp(14px,2.2vw,24px);left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:0 clamp(14px,2.2vw,24px);\">\n    \u003Cbutton onClick=\"{{ onBack }}\" style=\"position:absolute;left:clamp(14px,2.2vw,24px);width:clamp(44px,5vw,54px);height:clamp(44px,5vw,54px);border-radius:50%;background:#fff;border:none;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;\">\n      \u003Csvg viewBox=\"0 0 24 24\" style=\"width:44%;height:44%;\">\u003Cpath d=\"M15 4 L7 12 L15 20\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003C/svg>\n    \u003C/button>\n    \u003Cdiv style=\"display:flex;align-items:center;gap:11px;\">\n      \u003Cspan style=\"font-family:'Jua',sans-serif;color:#fff;font-size:clamp(22px,3vw,34px);white-space:nowrap;\">{{ name }}\u003C/span>\n    \u003C/div>\n  \u003C/div>\n\n  \u003C!-- pager (단어나라 35단계: 한 화면 10단계, 좌우로 페이지 이동) -->\n  \u003Csc-if value=\"{{ hasPager }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003Cbutton onClick=\"{{ prevPage }}\" style=\"position:absolute;left:clamp(10px,1.8vw,22px);top:50%;transform:translateY(-50%);z-index:21;width:clamp(46px,5.4vw,60px);height:clamp(46px,5.4vw,60px);border-radius:50%;background:#fff;border:none;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ prevOp }};\">\n      \u003Csvg viewBox=\"0 0 24 24\" style=\"width:44%;height:44%;\">\u003Cpath d=\"M15 4 L7 12 L15 20\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003C/svg>\n    \u003C/button>\n    \u003Cbutton onClick=\"{{ nextPage }}\" style=\"position:absolute;right:clamp(10px,1.8vw,22px);top:50%;transform:translateY(-50%);z-index:21;width:clamp(46px,5.4vw,60px);height:clamp(46px,5.4vw,60px);border-radius:50%;background:#fff;border:none;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ nextOp }};\">\n      \u003Csvg viewBox=\"0 0 24 24\" style=\"width:44%;height:44%;\">\u003Cpath d=\"M9 4 L17 12 L9 20\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003C/svg>\n    \u003C/button>\n    \u003Cdiv style=\"position:absolute;left:50%;bottom:clamp(12px,2vw,20px);transform:translateX(-50%);z-index:21;display:flex;align-items:center;gap:10px;\">\n      \u003Csc-for list=\"{{ pageDots }}\" as=\"pd\" hint-placeholder-count=\"4\">\n        \u003Cdiv onClick=\"{{ pd.go }}\" style=\"width:{{ pd.size }};height:{{ pd.size }};border-radius:50%;background:{{ pd.bg }};box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);cursor:pointer;\">\u003C/div>\n      \u003C/sc-for>\n      \u003Cspan style=\"font-family:'Jua',sans-serif;color:rgba(255,255,255,.85);font-size:clamp(14px,1.7vw,18px);margin-left:6px;\">{{ pageLabel }}\u003C/span>\n    \u003C/div>\n  \u003C/sc-if>\n\n  \u003C!-- node grid -->\n  \u003Cdiv style=\"position:relative;z-index:1;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(70px,9vw,120px) clamp(20px,4vw,60px) clamp(40px,5vw,70px);\">\n    \u003Cdiv style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(28px,4.4vw,64px) clamp(34px,5.4vw,86px);justify-items:center;align-items:start;\">\n\n      \u003Csc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"10\">\n        \u003Cdiv style=\"position:relative;width:clamp(62px,7.3vw,96px);height:clamp(62px,7.3vw,96px);\">\n\n          \u003Csc-if value=\"{{ n.done }}\" hint-placeholder-val=\"{{ true }}\">\n            \u003Cdiv onClick=\"{{ n.open }}\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);cursor:pointer;\">\n              \u003Cspan style=\"font-family:'Jua',sans-serif;color:#fff;font-size:clamp(26px,3.2vw,42px);\">{{ n.num }}\u003C/span>\n            \u003C/div>\n          \u003C/sc-if>\n\n          \u003Csc-if value=\"{{ n.current }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003Cdiv onClick=\"{{ n.open }}\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(180deg,{{ accent }},{{ accentDark }});cursor:pointer;animation:glm_stage_glow 1.8s ease-in-out infinite;\">\n              \u003Cspan style=\"font-family:'Jua',sans-serif;color:#fff;font-size:clamp(26px,3.2vw,42px);\">{{ n.num }}\u003C/span>\n            \u003C/div>\n          \u003C/sc-if>\n\n          \u003Csc-if value=\"{{ n.locked }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003Cdiv style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);cursor:not-allowed;\">\n              \u003Cspan style=\"font-family:'Jua',sans-serif;color:rgba(255,255,255,.55);font-size:clamp(26px,3.2vw,42px);\">{{ n.num }}\u003C/span>\n              \u003Cdiv style=\"position:absolute;top:-4px;right:-4px;width:clamp(20px,2.3vw,26px);height:clamp(20px,2.3vw,26px);border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.16);\">\n                \u003Csvg viewBox=\"0 0 24 24\" style=\"width:56%;height:auto;\">\u003Crect x=\"5\" y=\"11\" width=\"14\" height=\"9.5\" rx=\"2.4\" fill=\"{{ accent }}\" opacity=\".9\"/>\u003Cpath d=\"M8 11 V8.2 a4 4 0 0 1 8 0 V11\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"2.6\" opacity=\".9\"/>\u003C/svg>\n              \u003C/div>\n            \u003C/div>\n          \u003C/sc-if>\n\n          \u003Csc-if value=\"{{ n.showStars }}\" hint-placeholder-val=\"{{ true }}\">\n            \u003Cdiv style=\"position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);display:flex;align-items:flex-start;gap:0;\">\n              \u003Csc-for list=\"{{ n.stars }}\" as=\"st\" hint-placeholder-count=\"3\">\n                \u003Csvg viewBox=\"0 0 24 24\" style=\"width:clamp(28px,3.4vw,41px);transform:translateY({{ st.ty }});overflow:visible;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));\">\u003Cpath d=\"M12 1.9c.6 0 1.15.34 1.42.88l2.3 4.66 5.14.75c.6.09 1.1.51 1.29 1.08.18.58.03 1.21-.41 1.63l-3.72 3.62.88 5.12c.1.6-.15 1.21-.65 1.57-.5.36-1.16.4-1.7.12L12 19.55l-4.6 2.42c-.54.28-1.2.24-1.7-.12-.5-.36-.75-.97-.65-1.57l.88-5.12-3.72-3.62c-.44-.42-.59-1.05-.41-1.63.19-.57.69-.99 1.29-1.08l5.14-.75 2.3-4.66c.27-.54.82-.88 1.42-.88z\" fill=\"{{ st.fill }}\" stroke=\"{{ st.stroke }}\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/>\u003Cg clip-path=\"url(#glmStarClip)\">\u003Cellipse cx=\"9\" cy=\"6.4\" rx=\"6.6\" ry=\"4\" fill=\"#fff\" opacity=\"{{ st.o1 }}\"/>\u003Cellipse cx=\"15.5\" cy=\"9\" rx=\"2.4\" ry=\"1.6\" fill=\"#fff\" opacity=\"{{ st.o2 }}\"/>\u003Cellipse cx=\"12\" cy=\"23\" rx=\"12\" ry=\"6.5\" fill=\"{{ st.bf }}\" opacity=\"{{ st.bo }}\"/>\u003C/g>\u003C/svg>\n              \u003C/sc-for>\n            \u003C/div>\n          \u003C/sc-if>\n\n        \u003C/div>\n      \u003C/sc-for>\n\n    \u003C/div>\n  \u003C/div>\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:560},&quot;nation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;단어나라&quot;,&quot;음절나라&quot;,&quot;음소나라&quot;],&quot;default&quot;:&quot;단어나라&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;나라&quot;},&quot;unlocked&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;진행&quot;},&quot;starsMap&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{},&quot;tsType&quot;:&quot;Record&lt;number,number&gt;&quot;,&quot;section&quot;:&quot;진행&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null }; /* null = 현재 진행 단계가 있는 페이지 자동 표시 */\n  themes = {\n    '단어나라': { accent:'#2fae5c', accentDark:'#16823f', bg:'radial-gradient(130% 90% at 50% -10%,#56d98a 0%,#3fc46e 55%,#2fa85a 100%)' },\n    '음절나라': { accent:'#3f6fe6', accentDark:'#2350c0', bg:'radial-gradient(130% 90% at 50% -10%,#7da6ff 0%,#5b8cff 55%,#3f6fe6 100%)' },\n    '음소나라': { accent:'#5a48c4', accentDark:'#3f2fa0', bg:'radial-gradient(130% 90% at 50% -10%,#7d6cf0 0%,#6a5ae0 55%,#5546c4 100%)' },\n  };\n  renderVals(){\n    const nation = this.props.nation ?? '단어나라';\n    const th = this.themes[nation] || this.themes['단어나라'];\n    /* [GLIM_M v1.7.2] 단어나라 35단계 — 한 화면 10단계 유지, 페이지 분할 */\n    const total = (nation === '단어나라' && window.GLIM_M) ? GLIM_M.STAGES.length : 10;\n    const unlocked = Math.max(1, Math.min(total, this.props.unlocked ?? 1));\n    const PER = 10;\n    const pageCount = Math.ceil(total / PER);\n    let page = this.state.page == null ? Math.floor((unlocked - 1) / PER) : this.state.page;\n    page = Math.max(0, Math.min(pageCount - 1, page));\n    const ps = page * PER, pe = Math.min(total, ps + PER);\n    const starsMap = this.props.starsMap || {};\n    const onOpen = this.props.onOpen || (()=>{});\n\n    const mkStar = (gold, mid) => gold\n      ? { fill:'url(#glmGold)', stroke:'#eda23c', o1:.66, o2:.5, bf:'#e89a3a', bo:.4, ty: mid ? '5px' : '-6px' }\n      : { fill:'url(#glmGrey)', stroke:'#3f3b57', o1:.3, o2:0, bf:'#2c2942', bo:.45, ty: mid ? '5px' : '-6px' };\n\n    const nodes = [];\n    for (let i = ps; i \u003C pe; i++) {\n      const open = i \u003C unlocked;\n      const current = i === unlocked - 1;   // 가장 최근에 열린 단계\n      const done = open && !current;\n      const sc = open ? (starsMap[i] || 0) : 0;\n      nodes.push({\n        num: i + 1,\n        done, current, locked: !open,\n        showStars: open,\n        open: () => onOpen(i),\n        stars: [1, 2, 3].map(k => mkStar(k \u003C= sc, k === 2)),\n      });\n    }\n    /* 마지막 페이지도 5×2 배치 유지: 빈 자리 채움(투명 셀) */\n    while (pageCount > 1 && nodes.length \u003C PER)\n      nodes.push({ num: '', done: false, current: false, locked: false, showStars: false, open: () => {}, stars: [] });\n    const dotN = 'clamp(11px,1.3vw,14px)', dotY = 'clamp(15px,1.7vw,19px)';\n    return {\n      name: nation, accent: th.accent, accentDark: th.accentDark, bg: th.bg, nodes,\n      onBack: this.props.onBack || (()=>{}),\n      hasPager: pageCount > 1,\n      prevPage: () => this.setState({ page: Math.max(0, page - 1) }),\n      nextPage: () => this.setState({ page: Math.min(pageCount - 1, page + 1) }),\n      prevOp: page > 0 ? '1' : '0.35',\n      nextOp: page \u003C pageCount - 1 ? '1' : '0.35',\n      pageLabel: (ps + 1) + '~' + pe + '단계',\n      pageDots: Array.from({ length: pageCount }, (_, p) => ({\n        bg: p === page ? '#fff' : 'rgba(255,255,255,.3)',\n        size: p === page ? dotY : dotN,\n        go: () => this.setState({ page: p }),\n      })),\n    };\n  }\n}\n\u003C/script>\n\u003C/body>\n\u003C/html>\n","글림 게임플레이.dc.html":"\u003C!DOCTYPE html>\n\u003Chtml>\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003Cscript src=\"./support.js\">\u003C/script>\n\u003C/head>\n\u003Cbody>\n\u003Cx-dc>\n\u003Chelmet>\n\u003Clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003Clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003Clink href=\"https://fonts.googleapis.com/css2?family=Dongle&family=Jua&display=swap\" rel=\"stylesheet\">\n\u003Cstyle>\n  html,body{margin:0;padding:0;min-height:100%;background:#2fa85a;-webkit-tap-highlight-color:transparent;overflow:hidden;}\n  *{box-sizing:border-box;}\n  @keyframes glm_fade{fro );padding:16px 12px;box-shadow:0 5px 0 #3b3340;cursor:pointer;color:{{ o.color }};opacity:{{ o.op }};animation:{{ o.anim }};\">{{ o.text }}\u003C/button>\n        \u003C/sc-for>\n      \u003C/div>\n      \u003Cdiv style=\"font-family:'Dongle',sans-serif;color:#e7eaf2;font-size:clamp(16px,2vw,20px);\">{{ tutProg }}\u003C/div>\n    \u003C/div>\n  \u003C/sc-if>\n\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600},&quot;nation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;단어나라&quot;,&quot;음절나라&quot;,&quot;음소나라&quot;],&quot;default&quot;:&quot;단어나라&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;게임&quot;},&quot;stageIdx&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;게임&quot;}}\">\nclass Component extends DCLogic {\n  // ===== 한글 유틸 =====\n  CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];\n  JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];\n  JONGL=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];\n  decom(s){const c=s.charCodeAt(0)-0xAC00;if(c\u003C0||c>11171)return null;return [this.CHO[(c/588)|0],this.JUNG[((c%588)/28)|0],(c%28)?this.JONGL[c%28]:null];}\n  compose(ch,j,k){return String.fromCharCode(0xAC00+this.CHO.indexOf(ch)*588+this.JUNG.indexOf(j)*28+(k?this.JONGL.indexOf(k):0));}\n  clipFor(j,k,filled){const vert=['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ'].indexOf(j)>=0,tot=k?3:2;\n    if(vert){const f=tot===2?(filled>=2?1:0.5):(filled>=3?1:filled===2?0.72:0.42);return 'inset(0 0 '+Math.round((1-f)*100)+'% 0)';}\n    if(tot===2)return filled>=2?'inset(0)':'inset(0 45% 0 0)';\n    return filled>=3?'inset(0)':filled===2?'inset(0 0 30% 0)':'inset(0 45% 30% 0)';}\n  regionRect(j,k,sl){const vert=['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ'].indexOf(j)>=0,tot=k?3:2;\n    if(vert){if(tot===2)return sl===0?{t:0,l:0,w:100,h:50}:{t:50,l:0,w:100,h:50};\n      return sl===0?{t:0,l:0,w:100,h:42}:sl===1?{t:42,l:0,w:100,h:30}:{t:72,l:0,w:100,h:28};}\n    if(tot===2)return sl===0?{t:0,l:0,w:55,h:100}:{t:0,l:55,w:45,h:100};\n    return sl===0?{t:0,l:0,w:55,h:70}:sl===1?{t:0,l:55,w:45,h:70}:{t:70,l:0,w:100,h:30};}\n\n  // ===== 데이터 (글림 메커니즘) =====\n  STAGES=[\n    {band:'1음절',jong:0,pool:[['차','🚗'],['코','👃'],['새','🐦'],['게','🦀']]},\n    {band:'1음절',jong:1,pool:[['달','🌙'],['말','🐴'],['공','⚽'],['곰','🐻']]},\n    {band:'2음절',jong:0,pool:[['나무','🌳'],['모자','🧢'],['오리','🦆'],['기차','🚂']]},\n    {band:'2음절',jong:1,pool:[['가방','🎒'],['우산','☂️'],['사탕','🍬'],['수박','🍉']]},\n    {band:'2음절',jong:2,pool:[['장갑','🧤'],['김밥','🍙'],['신발','👟'],['풍선','🎈']]},\n    {band:'3음절',jong:0,pool:[['바나나','🍌'],['코끼리','🐘'],['토마토','🍅'],['무지개','🌈']]},\n    {band:'3음절',jong:1,pool:[['자동차','🚙'],['강아지','🐶'],['호랑이','🐯'],['송아지','🐮']]},\n    {band:'3음절',jong:2,pool:[['책가방','🎒'],['장난감','🧸'],['손가락','✋'],['손수건','🧣']]},\n  ];\n  NIDX={word:[0,1,2,3,4,5,6,7],syllable:[2,3,4,5,6,7],phoneme:[0,1,2,3,4,5,6,7]};\n  MODEOF={'단어나라':'word','음절나라':'syllable','음소나라':'phoneme'};\n  SPDVAL=[2.0,3.1,4.4]; SPNAME=['하','중','상'];\n  choG=[['ㅁ','ㅂ','ㅍ'],['ㄴ','ㄷ','ㅌ','ㄹ'],['ㅅ','ㅈ','ㅊ'],['ㄱ','ㅋ'],['ㅎ']];\n  jungG=[['ㅏ','ㅓ','ㅡ'],['ㅗ','ㅜ'],['ㅣ','ㅐ','ㅔ']];\n  jongG=[['ㄴ','ㅇ','ㅁ'],['ㄹ'],['ㄱ','ㄷ','ㅂ']];\n  themes={\n    '단어나라':{bg:'radial-gradient(130% 90% at 50% -10%,#9be7c0 0%,#74cf9d 55%,#5ec08c 100%)'},\n    '음절나라':{bg:'radial-gradient(130% 90% at 50% -10%,#a9d2ff 0%,#7aa8f4 55%,#6b97ec 100%)'},\n    '음소나라':{bg:'radial-gradient(130% 90% at 50% -10%,#c6b8ff 0%,#9a86f4 55%,#8470ec 100%)'},\n  };\n  rnd(a){return a[Math.random()*a.length|0];}\n  shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}\n  crossPick(groups,excl){const gi=groups.findIndex(g=>g.indexOf(excl)>=0);let pool=[];groups.forEach((g,i)=>{if(i!==gi)pool=pool.concat(g);});if(!pool.length)pool=[].concat.apply([],groups);return this.rnd(pool);}\n  distSyl(t){const d=this.decom(t);if(!d)return t;const c=this.crossPick(this.choG,d[0]),j=this.crossPick(this.jungG,d[1]),k=d[2]?this.crossPick(this.jongG,d[2]):null;try{return this.compose(c,j,k);}catch(e){return this.compose('ㄱ',j,k);}}\n  distJamo(type,correct){return this.crossPick(type==='cho'?this.choG:type==='jung'?this.jungG:this.jongG,correct);}\n  buildStageList(mode){const list=[];this.NIDX[mode].forEach(bi=>{const pl=this.STAGES[bi].pool,n=pl.length;[[0,1,2],[n-3,n-2,n-1]].forEach(win=>{list.push({jong:this.STAGES[bi].jong,band:this.STAGES[bi].band,words:win.map(k=>pl[k])});});});\n    const capped=list.slice(0,10),N=capped.length;\n    capped.forEach((s,i)=>{const pr=N>1?i/(N-1):0;let L=2+Math.round(pr*2);s.lanes=(mode==='word')?Math.min(L,3):Math.min(L,4);s.spd=Math.round(pr*2);s.intro=(i===0);});\n    return capped;}\n  stageList(mode){\n    /* [GLIM_M v1.7.2] 단어나라: 5세트×7단계=35 (pathIdx0=인트로). 음절·음소 원본 유지 */\n    if(mode==='word'&&window.GLIM_M)return GLIM_M.STAGES;\n    this._lists=this._lists||{};if(!this._lists[mode])this._lists[mode]=this.buildStageList(mode);return this._lists[mode];}\n\n  state={ lanes:2, pic:'', sylBoxes:[], phoBoxes:[], modeK:'word', gateDoors:null, obs:null, tut:null, big:null, banner:null, showBuild:false };\n\n  // ===== 라이프사이클 =====\n  componentDidMount(){\n    this._timers=[];this._alive=true;\n    this._keyH=(e)=>{if(e.key==='ArrowLeft'){this.move(-1);e.preventDefault();}if(e.key==='ArrowRight'){this.move(1);e.preventDefault();}};\n    window.addEventListener('keydown',this._keyH);\n    this.startStage();\n  }\n  componentWillUnmount(){this._alive=false;this.running=false;window.removeEventListener('keydown',this._keyH);(this._timers||[]).forEach(t=>clearTimeout(t));\n    /* [GLIM_M] 판 도중 이탈: 그 판 버퍼 폐기(원장 무결성 우선) */\n    if(this.mode==='word'&&window.GLIM_M&&this.running!==undefined)try{GLIM_M.dropBuffer();}catch(e){}}\n  later(fn,ms){const t=setTimeout(()=>{if(this._alive)fn();},ms);this._timers.push(t);return t;}\n\n  // ===== 사운드/음성 =====\n  say(t,r){if(!('speechSynthesis' in window)||!t)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=r||.95;speechSynthesis.speak(u);}catch(e){}}\n  initAudio(){if(this.actx)return;try{this.actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}\n  beep(f,d,t,v,w){if(!this.actx)return;const x=this.actx.currentTime+(w||0),o=this.actx.createOscillator(),g=this.actx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,x);g.gain.setValueAtTime(.0001,x);g.gain.exponentialRampToValueAtTime(v||.2,x+.012);g.gain.exponentialRampToValueAtTime(.0001,x+(d||.15));o.connect(g);g.connect(this.actx.destination);o.start(x);o.stop(x+(d||.15)+.03);}\n  sfx(k){this.initAudio();if(!this.actx)return;if(k==='correct'){this.beep(660,.12,'sine',.22);this.beep(990,.14,'sine',.18,.08);}else if(k==='wrong'){this.beep(180,.18,'square',.14);}else if(k==='combo'){this.beep(880,.1,'triangle',.2);this.beep(1240,.13,'triangle',.18,.07);}else if(k==='clear'){[523,659,784,1047].forEach((f,i)=>this.beep(f,.2,'triangle',.22,i*.12));}}\n\n  // ===== 게임 시작 =====\n  startStage(){\n    const nation=this.props.nation??'단어나라';\n    this.mode=this.MODEOF[nation]||'word';\n    const _cap=(this.mode==='word'&&window.GLIM_M)?(GLIM_M.STAGES.length-1):9;\n    this.si=Math.max(0,Math.min(_cap,this.props.stageIdx??0));\n    this.CS=this.stageList(this.mode)[this.si];\n    this.stageWords=this.CS.words;\n    this.score=0;this.combo=0;this.dist=0;this.correctCount=0;this.totalCount=0;this.obstacleHits=0;\n    this.gate=null;this.gateY=0;this.obstacle=null;this.busy=false;this.qpos=0;\n    this._errW={};this._gm=null;this._lastTs=null;this._curSpd=null; /* [GLIM_M] */\n    this.running=true;\n    /* [GLIM_M] 관문: gate1(1번째)·gate2(2번째, 결과 무관 전수)·mini(3번째~, 추적 단어만).\n       졸업(세션 분리 만점 2회) 시 스킵. 기존 튜토리얼 UI 재사용, 디자인 불변 */\n    if(this.mode==='word'&&window.GLIM_M){\n      const _gw=GLIM_M.gwNeeded(this.CS);\n      if(_gw)this.startTutorial(_gw);else this.beginRun();\n    }\n    else if(this.mode==='word'&&this.CS.intro)this.startTutorial(null);\n    else this.beginRun();\n    this.startLoop();\n  }\n  beginRun(){\n    this.phase='run';\n    this.scaff=this.CS.intro;this.guide=this.CS.intro;\n    this.lanes=this.CS.lanes;this.speedBase=this.SPDVAL[this.CS.spd];\n    this.carLane=this.tgt=(this.lanes-1)/2|0;\n    const divs=[];for(let i=1;i\u003Cthis.lanes;i++)divs.push({left:(22+56*i/this.lanes)+'%'});\n    const idx=[];for(let i=0;i\u003Cthis.stageWords.length;i++)idx.push(i);\n    const passes=this.CS.intro?1:2;let q=[];for(let p=0;p\u003Cpasses;p++)q=q.concat(this.shuf(idx));\n    this.queue=q;this.qpos=0;\n    if(this.mode==='word'&&window.GLIM_M){\n      /* [GLIM_M] 워밍업 계획(무표식) + 판 컨텍스트(힌트 예산·무효 상한) + 큐 */\n      this._plan=GLIM_M.warmPlan(this.CS);\n      this._mctx=GLIM_M.newStageCtx();\n      this.queueW=GLIM_M.buildQueue(this.CS,this._plan);this.qpos=0;\n      this._lastTs=performance.now();\n    }\n    this.setState({lanes:this.lanes,modeK:this.mode,showBuild:true,tut:null,\n      banner:{title:(this.si+1)+'단계 · '+this.lanes+'차선 '+this.SPNAME[this.CS.spd],sub:this.CS.intro?'천천히 따라와요 🐰':'출발!'},\n      dividers:divs});\n    this.later(()=>this.setState({banner:null}),1300);\n    this.later(()=>this.nextWord(),900);\n  }\n\n  // ===== 튜토리얼 (단어나라 1단계) =====\n  startTutorial(gw){this.phase='tutorial';\n    /* [GLIM_M] gw={phase:'gate1'|'gate2'|'mini', items:[단어쌍...]} — 없으면 원본 인트로 튜토리얼 */\n    this._gw=gw||null;\n    if(gw){this._gwQ=this.shuf(gw.items.slice()).map(p=>({w:p,first:true}));this._gwMissFirst=0;}\n    else this.tutQueue=this.shuf(this.stageWords.map((w,i)=>i));\n    this.setState({showBuild:false,tut:{}});this.tutNext();}\n  tutNext(){if(!this._alive)return;\n    if(this._gw){ /* [GLIM_M] 관문 모드 */\n      if(this._gwQ.length===0){\n        GLIM_M.gwPhaseDone(this.CS,this._gw,this._gwMissFirst||0);\n        this.setState({tut:null});this.beginRun();return;}\n      this.tutBusy=false;const it=this._gwQ[0],wo=it.w;\n      const others=this.CS.words.filter(p=>p[0]!==wo[0]).map(p=>p[0]);\n      const opts=this.shuf([wo[0]].concat(this.shuf(others).slice(0,2)));\n      this.setState({tut:{icon:wo[1],correct:wo[0],opts:opts.map(o=>({text:o,st:''})),remain:this._gwQ.length}});\n      this._gwT=performance.now();\n      /* 제시 무음(측정 순수화) · 시간제한 없음 — 자동 오답 타이머를 걸지 않는다 */\n      return;\n    }\n    if(this.tutQueue.length===0){this.setState({tut:null});this.beginRun();return;}\n    this.tutBusy=false;const wi=this.tutQueue[0],wo=this.stageWords[wi];\n    const others=this.stageWords.filter(p=>p[0]!==wo[0]).map(p=>p[0]);\n    const opts=this.shuf([wo[0]].concat(this.shuf(others).slice(0,2)));\n    this.setState({tut:{icon:wo[1],correct:wo[0],opts:opts.map(o=>({text:o,st:''})),remain:this.tutQueue.length}});\n    this.later(()=>this.say(wo[0]),150);\n    this._tutTimer=this.later(()=>this.tutPick(null,true),4000);\n  }\n  tutPick(chosen,timeout){if(this.tutBusy)return;this.tutBusy=true;clearTimeout(this._tutTimer);\n    const t=this.state.tut,correct=t.correct,ok=!timeout&&chosen===correct;\n    if(this._gw){ /* [GLIM_M] 관문: 기록(first_try) → 오답이면 교정 TTS + 대기열 끝 재출제 */\n      const it=this._gwQ.shift();\n      GLIM_M.gwLog(this.CS.set,this._gw.phase,correct,chosen==null?'⏱':chosen,ok,it.first?1:0,\n        performance.now()-(this._gwT||performance.now()));\n      if(it.first&&!ok)this._gwMissFirst=(this._gwMissFirst||0)+1;\n      if(!ok)this._gwQ.push({w:it.w,first:false});\n      const opts2=t.opts.map(o=>{const c={text:o.text,st:''};\n        if(ok){if(o.text===chosen)c.st='ok';}\n        else{c.st=o.text===correct?'no':'dim';}\n        return c;});\n      this.setState({tut:Object.assign({},t,{opts:opts2})});\n      if(ok){this.sfx('correct');}else{this.say(correct);this.sfx('wrong');}\n      this.later(()=>this.tutNext(),ok?560:1250);\n      return;\n    }\n    co .assign({},b,{hlShow:'none'}))});\n      this.wordDone();\n    } else this.spawnGate();\n  }\n  wordDone(){this.showBig(this.rnd(['좋아!','멋져!','최고!','잘했어!']),'#fff');this.qpos++;this.later(()=>this.nextWord(),650);}\n  stageClear(){\n    this.running=false;this.sfx('clear');\n    const acc=this.totalCount?this.correctCount/this.totalCount:1;\n    const stars=(this.obstacleHits===0&&acc>=0.9)?3:(acc>=0.7)?2:1;\n    /* [GLIM_M] 판 종료: 관찰 마킹 → L0 일괄 저장 → 세트 마지막 단계 '최초' 완주면 CP */\n    if(this.mode==='word'&&window.GLIM_M){\n      try{GLIM_M.onStageClear(this.CS,this._errW||{});}catch(e){}\n    }\n    const done=this.props.onFinish;\n    this.later(()=>{if(done)done({stars,score:Math.round(this.dist),acc});},600);\n  }\n\n  // ===== 이펙트 =====\n  showBig(t,c){this.setState({big:{text:t,color:c||'#fff'}});this.later(()=>this.setState({big:null}),900);}\n  crashFx(){if(!this._steer)return;const el=this._steer;el.style.animation='glm_crashfx .5s';this.later(()=>{el.style.animation='';},520);}\n  boostFx(){if(!this._steer)return;const el=this._steer;el.style.animation='glm_boostfx .4s';this.later(()=>{el.style.animation='';},420);}\n  burst(){if(!this._fx||!this._car)return;\n    const cr=this._car.getBoundingClientRect(),rr=this._root.getBoundingClientRect();\n    const x=cr.left-rr.left+cr.width/2,y=cr.top-rr.top;\n    for(let i=0;i\u003C7;i++){const p=document.createElement('div');\n      const a=Math.random()*6.28,d=30+Math.random()*45;\n      p.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;font-size:'+(12+Math.random()*10)+'px;animation:glm_burst .65s ease-out forwards;';\n      p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');p.style.setProperty('--r',(Math.random()*360)+'deg');\n      p.textContent=['⭐','✨','🥕','💫'][i%4];this._fx.appendChild(p);\n      this.later(()=>p.remove(),700);}\n  }\n\n  renderVals(){\n    const nation=this.props.nation??'단어나라';\n    const th=this.themes[nation]||this.themes['단어나라'];\n    const s=this.state,t=s.tut;\n    return {\n      bg:th.bg,\n      stageLabel:nation+' '+((this.props.stageIdx??0)+1)+'단계',\n      dividers:s.dividers||[{left:'50%'}],\n      showBuild:s.showBuild, pic:s.pic,\n      sylMode:s.modeK==='syllable'&&s.sylBoxes.length>0,\n      phoMode:s.modeK==='phoneme'&&s.phoBoxes.length>0,\n      sylBoxes:s.sylBoxes, phoBoxes:s.phoBoxes,\n      hasGate:!!s.gateDoors, doors:s.gateDoors||[],\n      hasObs:!!s.obs,\n      obsEmoji:s.obs?s.obs.emoji:'', obsLeft:s.obs?s.obs.left:'0%', obsWidth:s.obs?s.obs.width:'10%', obsAnim:s.obs?s.obs.anim:'none',\n      hasBig:!!s.big, bigText:s.big?s.big.text:'', bigColor:s.big?s.big.color:'#fff',\n      hasBanner:!!s.banner, bannerTitle:s.banner?s.banner.title:'', bannerSub:s.banner?s.banner.sub:'',\n      hasTut:!!t&&!!t.opts, tutIcon:t&&t.icon||'', tutProg:t&&t.remain?('남은 글자 '+t.remain+'개'):'',\n      tutOpts:(t&&t.opts||[]).map(o=>({text:o.text,\n        bg:o.st==='ok'?'#dff6e9':o.st==='no'?'#ffe1e2':'#fff',\n        color:o.st==='no'?'#ff5c6c':'#2e2738',\n        op:o.st==='dim'?'0.45':'1',\n        anim:o.st==='no'?'glm_doorblock .25s':'none',\n        onPick:()=>this.tutPick(o.text,false)})),\n      moveL:()=>this.move(-1), moveR:()=>this.move(1),\n      sayWord:()=>{if(this.word&&this.mode!=='word')this.say(this.word[0]);}, /* [GLIM_M] 본게임 무음 */\n      onBack:this.props.onBack||(()=>{}),\n      rootRef:(el)=>{this._root=el;}, carRef:(el)=>{this._car=el;}, steerRef:(el)=>{this._steer=el;},\n      gateRef:(el)=>{this._gate=el;if(el&&this.gateY!=null)el.style.transform='translateY('+this.gateY+'px)';},\n      obsRef:(el)=>{this._obs=el;if(el&&this.obstacle)el.style.transform='translateY('+this.obstacle.y+'px)';},\n      distRef:(el)=>{this._dist=el;}, scoreRef:(el)=>{this._score=el;}, fxRef:(el)=>{this._fx=el;},\n    };\n  }\n}\n\u003C/script>\n\u003C/body>\n\u003C/html>\n","글림 결과팝업.dc.html":"\u003C!DOCTYPE html>\n\u003Chtml>\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Cmeta name=\"viewport\ <script>
/* ============================================================

window.GLIM_M = (function(){

var SPN=['하','중','상'];

/* ---------- 1. 단계표: 5세트 × 7단계 = 35 ---------- */
var WSETS = [
  {name:'차·코·새',   struct:'1음절 무받침', words:[['차','🚗'],['코','👃'],['새','🐦']]},
  {name:'달·곰·입',   struct:'1음절 받침',   words:[['달','🌙'],['곰','🐻'],['입','👄']]},

  {name:'가방·우산·기린', struct:'2음절 받침1',  words:[['가방','🎒'],['우산','☂️'],['기린','🦒']]},

/* pathIdx 0 = 인트로(2-0, 3게이트, 힌트 상시, 측정 제외), 1..6 = 측정 */
var PATH = [[2,0],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2]];
var STAGES = [];
WSETS.forEach(function(ws,si){
  PATH.forEach(function(p,pi){
    STAGES.push({idx:STAGES.length, no:STAGES.length+1, set:si, pathIdx:pi,
      lanes:p[0], spd:p[1], intro:(pi===0), cell:p[0]+'-'+p[1],

/* ---------- 2. 저장소 ---------- */
var K_PROF='glim_m2_prof_v1', K_L0='glim_m2_L0_v1';
var P=null, L0=[], BUF=[];
function freshWord(){return {exp:0,consec:0,scaffold:false,obs:0,guestPr:0};}
function freshProfile(){
  var words={};
  WSETS.forEach(function(ws){ws.words.forEach(function(w){words[w[0]]=freshWord();});});

}
function load(){
  try{P=JSON.parse(localStorage.getItem(K_PROF))||freshProfile();}catch(e){P=freshProfile();}
  try{L0=JSON.parse(localStorage.getItem(K_L0))||[];}catch(e){L0=[];}

}

function saveL0(){try{localStorage.setItem(K_L0,JSON.stringify(L0));}catch(e){}}

/* ============================================================

   ============================================================ */

  var q;
  if(warmOn){
    /* 워밍업 큐 규칙:
       ① 모든 게이트의 단어(정답·오답 모두) = 현재 세트 3단어 풀 안에서만
       ② 워밍업 마지막(2번째) 게이트 단어 = 규정 첫(3번째) 게이트 단어 — 몸 푼 단어로 규정 조건에 진입 */
    var counts=[3,3,3];
    var A=(Math.random()*3)|0;                          /* 연결 단어 */
    var q0=(A+1+((Math.random()*2)|0))%3;               /* 1번째 게이트: 연결 단어와 다른 단어 */
    counts[q0]--; counts[A]-=2;
    var order=[q0,A,A], rest=[];
    [0,1,2].forEach(function(i){for(var k=0;k<counts[i];k++)rest.push(i);});
    order=order.concat(shuf(rest));
    q=order.map(function(i){return {w:st.words[i],guest:0,extra:0};});
  }else{
    var bag=[];
    st.words.forEach(function(w,i){for(var k=0;k<3;k++)bag.push(i);});
    q=shuf(bag).map(function(i){return {w:st.words[i],guest:0,extra:0};});
  }
  if(st.set>=1){
    var g=pickGuest(st.set);
    if(g){
      var lo=warmOn?3:1;                    /* 워밍업 시 게스트는 연결 게이트(3번째) 뒤로 */
      var pos=lo+(Math.random()*(q.length-lo)|0);
      q[pos]={w:g,guest:1,extra:0};
      wordState(g[0]).guestPr=0;
    }
  }
  return q;
}

/* ---------- L0 기록 ---------- */
function logTrial(o){
  var s=wordState(o.tgt); s.exp++;
  if(o.inv)o.ctx.inv++;
  BUF.push({t:Date.now(),s:P.session,st:o.stage.no,set:o.stage.set,
    lanes:o.lanes,spd:o.spd,cell:o.lanes+'-'+o.spd,intro:o.stage.intro?1:0,
    tgt:o.tgt,sel:o.sel,ok:o.ok?1:0,
    rt:o.rt!=null?Math.round(o.rt):null,inp:o.inp||0,sl:o.sl||0,ci:o.ci||0,
    exp:s.exp,inv:o.inv?1:0,hint:o.hint?1:0,guest:o.guest?1:0,warm:o.warm?1:0});
}

/* ---------- 판 종료 ---------- */
function onStageClear(st, errByWord){
  Object.keys(errByWord||{}).forEach(function(w){
    if(errByWord[w]>=2)wordState(w).obs=1;
  });
  flush();
  var cp=null;

  }

/* ============================================================
   5. 체크포인트
   ============================================================ */
function validRows(){return L0.filter(function(r){return !r.intro&&!r.inv;});}
function corr(p,lanes){var g=1/lanes;return (p-g)/(1-g);}
function label(n){return n<C.LABEL_OBS?'참고':n<C.LABEL_TRUST?'관찰':'신뢰';}
function pct(v){return (v==null||isNaN(v))?'–':Math.round(v*100)+'%';}
function pp(v){return (v==null||isNaN(v))?'–':Math.round(v*100)+'%p';}

function cellStats(rows){
  var cells={};
  rows.forEach(function(r){
    var c=cells[r.cell]=(cells[r.cell]||{n:0,ok:0,lanes:r.lanes});
    c.n++; if(r.ok)c.ok++;
  });
  Object.keys(cells).forEach(function(k){
    var c=cells[k]; c.acc=c.ok/c.n; c.corr=corr(c.acc,c.lanes);
  });
  return cells;
}
/* 격차·유지율. 반환: {gap,gapMinN, ratio,ratioMinN, mid,midMinN, hi,hiMinN} */
function metrics(rows){
  var cells=cellStats(rows), out={cells:cells};
  var gaps=[],gn=Infinity;
  for(var s=0;s<3;s++){
    var a=cells['2-'+s],b=cells['3-'+s];
    if(a&&b&&a.n>0&&b.n>0){gaps.push(a.corr-b.corr);gn=Math.min(gn,a.n,b.n);}
  }
  out.gap=gaps.length?gaps.reduce(function(x,y){return x+y;},0)/gaps.length:null;
  out.gapMinN=gaps.length?gn:0;
  function ratioFor(spdHi){
    var rs=[],rn=Infinity;
    [2,3].forEach(function(L){
      var lo=cells[L+'-0'],hi=cells[L+'-'+spdHi];
      if(lo&&hi&&lo.n>0&&hi.n>0&&lo.corr>0.05){
        rs.push(Math.max(0,hi.corr)/lo.corr);rn=Math.min(rn,lo.n,hi.n);}
    });
    return rs.length?{v:rs.reduce(function(x,y){return x+y;},0)/rs.length,n:rn}:{v:null,n:0};
  }
  var hi=ratioFor(2), mid=ratioFor(1);
  out.ratio=hi.v; out.ratioMinN=hi.n;
  out.mid=mid.v;  out.midMinN=mid.n;
  return out;
}

function runCheckpoint(setDone){
  var all=validRows();
  var M=metrics(all);
  var log={t:Date.now(),setDone:setDone,notes:[]};

  /* A) 활성 처방 검증 — 발동 세트(=이번 세트) 데이터로, 해제만 변당 6행 */
  var setRows=all.filter(function(r){return r.set===setDone;});
  var SM=metrics(setRows);
  P.rx.forEach(function(rx){
    if(rx.type==='attention'&&(rx.status==='발동')){
      if(SM.gap==null||SM.gapMinN<C.RELEASE_MIN_N){
        rx.checks.push({set:setDone,gap:SM.gap,n:SM.gapMinN,hold:1});
        log.notes.push('주의: 검증 표본 부족('+SM.gapMinN+') → 보류·지속');
      }else{
        rx.checks.push({set:setDone,gap:SM.gap,n:SM.gapMinN});
        if(SM.gap<C.ATT_GAP){rx.status='해제';rx.after=SM.gap;
          log.notes.push('선택적 주의 해제: '+pp(rx.value0)+' → '+pp(SM.gap));}
        else log.notes.push('선택적 주의 지속: '+pp(SM.gap));
      }
    }
    if(rx.type==='efficiency'&&(rx.status==='발동'||rx.status==='부분해제')){
      var done=false;
      if(SM.ratio!=null&&SM.ratioMinN>=C.RELEASE_MIN_N&&SM.ratio>=C.EFF_REL_HI){
        rx.status='해제';rx.after=SM.ratio;done=true;
        rx.checks.push({set:setDone,hi:SM.ratio,mid:SM.mid,n:SM.ratioMinN});
        log.notes.push('수행 효율성 전체 해제: 상 유지율 '+pct(SM.ratio));
      }
      if(!done&&rx.status==='발동'&&SM.mid!=null&&SM.midMinN>=C.RELEASE_MIN_N&&SM.mid>=C.EFF_REL_MID){
        rx.status='부분해제';
        rx.checks.push({set:setDone,hi:SM.ratio,mid:SM.mid,n:SM.midMinN});
        log.notes.push('수행 효율성 부분 해제: 중 유지율 '+pct(SM.mid)+' → 상 속도만 유지');
        done=true;
      }
      if(!done){
        rx.checks.push({set:setDone,hi:SM.ratio,mid:SM.mid,n:SM.ratioMinN,hold:1});
        log.notes.push('수행 효율성 지속'+(SM.ratio!=null?': 상 '+pct(SM.ratio):' (표본 부족)'));
      }
    }
  });

  /* B) 신규 진단 — CP당 1건, 결손 > 주의 > 효율성 > 전반 > 순항 */
  var fired=false, isLast=(setDone===WSETS.length-1);
  function pushRx(type,value0,extra){
    var rx={id:'RX'+(P.rxSeq++),type:type,status:isLast?'이월':(extra&&extra.status)||'발동',
      value0:value0,t:Date.now(),setFired:setDone+1,checks:[]};
    if(extra)Object.keys(extra).forEach(function(k){rx[k]=extra[k];});
    if(isLast)rx.carried=true;
    P.rx.push(rx);return rx;
  }
  /* Q2 결손: 이번 세트 관문 first_try */
  (function(){
    var g=gwState(setDone), ws=WSETS[setDone].words.map(function(p){return p[0];});
    var stat={};
    ws.forEach(function(w){stat[w]={n:0,ok:0};});
    g.records.forEach(function(r){
      if(r.first_try&&stat[r.tgt]!=null){stat[r.tgt].n++;if(r.ok)stat[r.tgt].ok++;}
    });
    for(var i=0;i<ws.length&&!fired;i++){
      var w=ws[i],s=stat[w];
      if(s.n<C.DEF_MIN)continue;
      if(s.ok/s.n>=C.DEF_ACC)continue;
      var peersOk=ws.every(function(o){
        if(o===w)return true;
        return (stat[o].n-stat[o].ok)<=C.DEF_PEER_MISS;});
      var already=P.rx.some(function(r){return r.type==='worddef'&&r.word===w;});
      if(peersOk&&!already){
        var rx=pushRx('worddef',s.ok/s.n,{word:w,status:'이관'});
        rx.status='이관'; /* 결손은 마지막 세트여도 이관 */ rx.carried=false;
        wordState(w).guestPr+=3;
        log.notes.push("단어 결손 이관: '"+w+"' 관문 첫 시도 "+s.ok+'/'+s.n+' — 직접 교수 필요 (게스트 관찰 지속)');
        fired=true;
      }
    }
  })();
  /* Q3a 주의 */
  if(!fired&&M.gap!=null&&M.gap>=C.ATT_GAP&&!P.rx.some(function(r){return r.type==='attention';})){
    pushRx('attention',M.gap);
    log.notes.push('선택적 주의 '+(isLast?'이월 예약':'발동')+': 격차 '+pp(M.gap)+' ['+label(M.gapMinN)+']');
    fired=true;
  }
  /* Q3b 효율성 */
  if(!fired&&M.ratio!=null&&M.ratio<C.EFF_RATIO&&!P.rx.some(function(r){return r.type==='efficiency';})){
    pushRx('efficiency',M.ratio);
    log.notes.push('수행 효율성 '+(isLast?'이월 예약':'발동')+': 유지율 '+pct(M.ratio)+' ['+label(M.ratioMinN)+']');
    fired=true;
  }
  /* Q3c 전반 민감 */
  if(!fired&&M.gap!=null&&M.ratio!=null&&
     M.gap>=C.GLB_GAP[0]&&M.gap<C.GLB_GAP[1]&&
     M.ratio>=C.GLB_RATIO[0]&&M.ratio<C.GLB_RATIO[1]&&
     !P.rx.some(function(r){return r.type==='global';})){
    pushRx('global',M.gap,{status:'기록'});
    log.notes.push('전반 부하 민감 — 기록만 (세트 반복 권장)');
    fired=true;
  }
  if(!fired){
    if(M.gap==null&&M.ratio==null)log.notes.push('표본 부족 — 판정 보류');
    else log.notes.push('순항 — 신규 처방 없음');
  }

  P.cpDone=setDone+1;
  P.lastCp=log; saveP();
  return log;
}

/* ============================================================
   6. 데모 학생 생성기 (교사 리포트 시연용) — 결정적 오차확산
   서사: CP1 순항 → CP2 '곰' 결손 이관(관문 축) → CP3 주의 발동
        → CP4 주의 해제 + 효율성 발동 → CP5 효율성 부분 해제
   ============================================================ */
function genDemo(){
  resetAll();
  var T0=Date.now()-86400000*14;
  var diff={};
  function okD(key,p){
    if(diff[key]==null)diff[key]=0.5;
    diff[key]+=p;
    if(diff[key]>=1){diff[key]-=1;return 1;}
    return 0;
  }
  function row(st,tgt,ok,extra){
    T0+=4000;
    var r={t:T0,s:P.session,st:st.no,set:st.set,lanes:st.lanes,spd:st.spd,
      cell:st.cell,intro:st.intro?1:0,tgt:tgt,sel:ok?tgt:'✕',ok:ok?1:0,
      rt:480+(Math.random()*500|0)+st.spd*90,inp:1+(Math.random()*2|0),
      sl:Math.random()*st.lanes|0,ci:Math.random()*st.lanes|0,
      exp:++wordState(tgt).exp,inv:0,hint:0,guest:0,warm:0};
    if(extra)Object.keys(extra).forEach(function(k){r[k]=extra[k];});
    L0.push(r);
  }
  function accFor(st,set){
    var p=0.92-st.spd*0.04;
    if(st.lanes===3&&set<=2)p-=0.36;            /* 세트1~3: 3차선 붕괴(주의) */
    if(set>=3&&st.spd===2)p-=0.40;              /* 세트4~: 상 속도 붕괴(효율성) */
    if(set>=3&&st.spd===1)p-=0.10;
    if(set===4&&st.spd===1)p=0.93;              /* 세트5: 중 회복 → 부분 해제 */
    return Math.max(0.15,Math.min(0.95,p));
  }
  function playStage(st){
    if(st.intro){st.words.forEach(function(w){row(st,w[0],1,{intro:1,inv:1,hint:1});});return;}
    for(var g=0;g<9;g++){
      var w=st.words[g%3][0];
      row(st,w,okD(st.cell+'|'+w+'|'+st.set,accFor(st,st.set)));
    }
  }
  function gwPerfect(set,phase,sess){
    WSETS[set].words.forEach(function(p){
      gwState(set).records.push({s:sess,set:set,phase:phase,tgt:p[0],sel:p[0],ok:1,first_try:1,rt:900+(Math.random()*700|0)});
    });
  }
  /* 세트1: 관문 완벽·순항 */
  gwPerfect(0,'gate1',1);gwPerfect(0,'gate2',1);
  var g0=gwState(0);g0.attempts=1;g0.streak=1;g0.lastPerfectSession=1;
  STAGES.filter(function(s){return s.set===0;}).forEach(playStage);
  runCheckpoint(0);
  /* 세트2: '곰' 관문 반복 오답 → 결손 */
  var g1=gwState(1);g1.attempts=1;
  [['달',1],['곰',0],['입',1]].forEach(function(x){g1.records.push({s:2,set:1,phase:'gate1',tgt:x[0],sel:x[1]?x[0]:'입',ok:x[1],first_try:1,rt:1500});});
  [['달',1],['곰',0],['입',1]].forEach(function(x){g1.records.push({s:2,set:1,phase:'gate2',tgt:x[0],sel:x[1]?x[0]:'달',ok:x[1],first_try:1,rt:1600});});
  g1.track['곰']={targeting:true,consecOk:0};
  [0,1,0].forEach(function(ok,i){g1.records.push({s:2,set:1,phase:'mini',tgt:'곰',sel:ok?'곰':'입',ok:ok,first_try:1,rt:1400+i*100});});
  STAGES.filter(function(s){return s.set===1;}).forEach(playStage);
  runCheckpoint(1);                                   /* CP2: 곰 이관 */
  /* 세트3 */
  gwPerfect(2,'gate1',3);gwPerfect(2,'gate2',3);
  STAGES.filter(function(s){return s.set===2;}).forEach(playStage);
  [1,0,1,1,0,1].forEach(function(ok){row(STAGES[15],'곰',ok,{guest:1});}); /* 곰 게스트 관찰 */
  runCheckpoint(2);                                   /* CP3: 주의 발동 */
  /* 세트4: 3차선 회복(워밍업 효과) — 주의 검증 통과 */
  gwPerfect(3,'gate1',4);gwPerfect(3,'gate2',4);
  STAGES.filter(function(s){return s.set===3;}).forEach(function(st){
    if(st.intro){playStage(st);return;}
    for(var g=0;g<9;g++){
      var w=st.words[g%3][0];
      var p=0.88-st.spd*0.04; if(st.spd===2)p-=0.40; if(st.spd===1)p-=0.10;
      var warm=(!st.intro&&g<2&&st.pathIdx>=4);
      row(st,w,okD(st.cell+'|'+w+'|s4',Math.max(0.15,p)),warm?{warm:1,inv:1}:null);
    }
  });
  runCheckpoint(3);                                   /* CP4: 주의 해제 + 효율성 발동 */
  /* 세트5: 중 회복·상 미회복 — 부분 해제 */
  gwPerfect(4,'gate1',5);gwPerfect(4,'gate2',5);
  STAGES.filter(function(s){return s.set===4;}).forEach(function(st){
    if(st.intro){playStage(st);return;}
    for(var g=0;g<9;g++){
      var w=st.words[g%3][0];
      var warm=(!st.intro&&g<2&&(st.pathIdx===2||st.pathIdx===3||st.pathIdx===5||st.pathIdx===6));
      row(st,w,okD(st.cell+'|'+w+'|s5',accFor(st,4)),warm?{warm:1,inv:1}:null);
    }
  });
  runCheckpoint(4);                                   /* CP5: 부분 해제 */
  saveL0(); saveP();
  /* 앱 진행도 반영 (맵 35단계 해금) */
  var stars={}; for(var i=0;i<34;i++)stars[i]=2+(Math.random()*2|0);
  if(window.__GLIM_SETPROG__)window.__GLIM_SETPROG__('단어나라',{unlocked:35,stars:stars});
  else{try{
    var raw=localStorage.getItem('glim_app_prog_v172');
    var prog=raw?JSON.parse(raw):{'단어나라':{unlocked:1,stars:{}},'음절나라':{unlocked:1,stars:{}},'음소나라':{unlocked:1,stars:{}}};
    prog['단어나라']={unlocked:35,stars:stars};
    localStorage.setItem('glim_app_prog_v172',JSON.stringify(prog));
  }catch(e){}}
}

/* ============================================================
   6-2. 시연 시나리오 주입기 — 버튼 하나로 학생 상태 전체 교체
   각 시나리오는 "해당 메커니즘이 발동하는 단계 직전"으로 세팅된다.

function setProgress(n){

  var obj={unlocked:n,stars:stars};
  if(window.__GLIM_SETPROG__)window.__GLIM_SETPROG__('단어나라',obj);
  else{try{
    var raw=localStorage.getItem('glim_app_prog_v172');
    var prog=raw?JSON.parse(raw):{'단어나라':{unlocked:1,stars:{}},'음절나라':{unlocked:1,stars:{}},'음소나라':{unlocked:1,stars:{}}};
    prog['단어나라']=obj;
    localStorage.setItem('glim_app_prog_v172',JSON.stringify(prog));
  }catch(e){}}
}
function genScenario(id){
  if(id===5){genDemo();return '5세트 완주 학생입니다. 리포트 전체를 보세요 — 곰 이관(단어별 프로파일), 주의 발동→해제·효율성 발동→부분해제(처방 대장), 관문 이력까지 서사가 이어집니다.';}
  resetAll();
  var T0=Date.now()-86400000*10, diff={};
  function okD(k,p){if(diff[k]==null)diff[k]=0.5;diff[k]+=p;if(diff[k]>=1){diff[k]-=1;return 1;}return 0;}
  function row(st,tgt,ok,extra){
    T0+=3500;
    var r={t:T0,s:P.session,st:st.no,set:st.set,lanes:st.lanes,spd:st.spd,cell:st.cell,
      intro:st.intro?1:0,tgt:tgt,sel:ok?tgt:'✕',ok:ok?1:0,
      rt:500+((T0/7|0)%400)+st.spd*80,inp:1,sl:0,ci:1,
      exp:++wordState(tgt).exp,inv:0,hint:0,guest:0,warm:0};
    if(extra)Object.keys(extra).forEach(function(k){r[k]=extra[k];});
    L0.push(r);
  }
  function playSet(si,accFn,warmFn){
    STAGES.filter(function(s){return s.set===si;}).forEach(function(st){
      if(st.intro){st.words.forEach(function(w){row(st,w[0],1,{intro:1,inv:1,hint:1});});return;}
      for(var g=0;g<9;g++){
        var w=st.words[g%3][0];
        var warm=warmFn?warmFn(st,g):false;
        row(st,w,okD(st.cell+'|'+w+'|'+si,accFn(st)),warm?{warm:1,inv:1}:null);
      }
    });
  }
  function gwDone(si,sess){
    var g=gwState(si);
    ['gate1','gate2'].forEach(function(ph){WSETS[si].words.forEach(function(p){
      g.records.push({s:sess,set:si,phase:ph,tgt:p[0],sel:p[0],ok:1,first_try:1,rt:900});});});
    g.attempts=2;g.streak=2;g.done=true;g.lastPerfectSession=sess;
  }
  var guide='';
  if(id===1){

      :r.status==='이월'?'<span class="tag mid">이월(음절나라)</span>'
      :'<span class="tag mid">'+r.status+'</span>';
    var det=r.word?("'"+r.word+"'"):(r.note||('세트'+(r.setFired||'–')+'부터'));
    var hist=(r.checks||[]).map(function(c){
      return 'CP'+(c.set+1)+': '+(c.gap!=null?M.pp(c.gap):(c.hi!=null?('상 '+M.pct(c.hi)+(c.mid!=null?'/중 '+M.pct(c.mid):'')):'–'))+(c.hold?'(보류)':'');
    }).join(' · ')||'–';
    html+='<tr><td>'+r.id+'</td><td>'+(RXN[r.type]||r.type)+'</td><td>'+stTag+'</td><td>'+esc(det)+'</td><td>'+v0+' → '+va+'</td><td>'+hist+'</td></tr>';
  });
  html+='</table></div>';

  /* 관문 이력 */
  html+='<div class="gd-card"><h3>관문 이력 <small>(첫 시도만 판정 표본 · 졸업 = 세션 분리 만점 2회 · 5회 미통과 이관)</small></h3><table>'+
    '<tr><th>세트</th><th>국면별 기록</th><th>gate1 시도</th><th>연속 만점</th><th>추적 중</th><th>상태</th></tr>';
  var gwK=Object.keys(P.gw);
  if(!gwK.length)html+='<tr><td colspan="6">기록 없음</td></tr>';
  gwK.forEach(function(set){
    var g=P.gw[set], byPh={};
    g.records.forEach(function(r){
      var b=byPh[r.phase]=(byPh[r.phase]||{n:0,ok:0});
      if(r.first_try){b.n++;if(r.ok)b.ok++;}
    });
    var phTxt=Object.keys(byPh).map(function(p){return PH[p]+' '+byPh[p].ok+'/'+byPh[p].n;}).join(' · ')||'–';
    var tracked=M.trackedWords(+set).join(', ')||'–';
    html+='<tr><td>세트'+(+set+1)+'</td><td>'+phTxt+'</td><td>'+g.attempts+'</td><td>'+g.streak+'</td><td>'+esc(tracked)+'</td><td>'+
      (g.done?'✅ 졸업':g.failFlag?'<span class="tag no">이관</span>':'진행 중')+'</td></tr>';
  });
  html+='</table></div>';

  /* 가설 상수 */
  html+='<div class="gd-card"><h3>가설 상수 v1.7.2</h3><table>'+
    '<tr><th>항목</th><th>값</th><th>항목</th><th>값</th></tr>'+
    '<tr><td>시간창 하/중/상</td><td>'+C.T.join(' / ')+'초 (델타타임)</td><td>단계 구성</td><td>세트당 인트로1 + 측정6 = 35</td></tr>'+
    '<tr><td>결손(관문 첫시도)</td><td>기록 '+C.DEF_MIN+'+ · '+M.pct(C.DEF_ACC)+' 미만 · 동료 오답 ≤'+C.DEF_PEER_MISS+'</td><td>추적 졸업</td><td>첫 시도 연속 2회 정답</td></tr>'+
    '<tr><td>주의 발동·해제</td><td>격차 '+M.pp(C.ATT_GAP)+'</td><td>주의 워밍업</td><td>3차선 단계 첫 2게이트 → 2차선 (무표식)</td></tr>'+
    '<tr><td>효율성 발동</td><td>유지율 '+M.pct(C.EFF_RATIO)+' 미만</td><td>효율성 워밍업</td><td>중·상 단계 첫 2게이트 한 단계 감속</td></tr>'+
    '<tr><td>부분/전체 해제</td><td>중 '+M.pct(C.EFF_REL_MID)+' / 상 '+M.pct(C.EFF_REL_HI)+'</td><td>해제 최소 표본</td><td>변당 '+C.RELEASE_MIN_N+'행 (발동 문턱 없음)</td></tr>'+
    '<tr><td>즉시 트랙</td><td>2연속 힌트(판·단어당 1회, 무효) / 3연속 재삽입</td><td>무효 상한</td><td>단계당 '+C.INVALID_CAP+'행 (유효 ≥5 보장)</td></tr>'+
    '<tr><td>표본 라벨</td><td>참고 &lt;'+C.LABEL_OBS+' / 관찰 / 신뢰 '+C.LABEL_TRUST+'+</td><td>신규 처방</td><td>CP당 1건 (결손&gt;주의&gt;효율&gt;전반)</td></tr>'+
    '</table></div>';

  html+='<div class="gd-note">L0 원본 '+M.l0().length+'건 · 유효 '+M.validRows().length+'건 · append-only · CP 계산 결과는 저장하지 않음(전체 재계산 가능)</div>';
  html+='</div>';
  var box=document.getElementById('glimDash');
  box.innerHTML=html;
  document.getElementById('gdClose').onclick=close;
  document.getElementById('gdRefresh').onclick=render;
  document.getElementById('gdReset').onclick=function(){
    if(confirm('모든 기록을 초기화할까요?\n· 인지프로파일(L0·관문·처방) 삭제\n· 앱 진행도: 세 나라 모두 1단계부터')){
      M.resetAll();
      var fresh={unlocked:1,stars:{}};
      try{localStorage.setItem('glim_app_prog_v172',JSON.stringify({'단어나라':{unlocked:1,stars:{}},'음절나라':{unlocked:1,stars:{}},'음소나라':{unlocked:1,stars:{}}}));}catch(e){}
      if(window.__GLIM_SETPROG__){['단어나라','음절나라','음소나라'].forEach(function(nn){window.__GLIM_SETPROG__(nn,fresh);});}
      render();
    }
  };
  document.getElementById('gdDemo').onclick=function(){window.__GLIM_SCN_ID__=5;window.__GLIM_SCN__=M.genScenario(5);render();};
  M.SCENARIOS.forEach(function(sc){
    var b=document.getElementById('gdScn'+sc.id);
    if(b)b.onclick=function(){window.__GLIM_SCN_ID__=sc.id;window.__GLIM_SCN__=M.genScenario(sc.id);render();};
  });
}
function open(){document.getElementById('glimDash').classList.add('on');render();}
function close(){document.getElementById('glimDash').classList.remove('on');}
function boot(){
  css();
  var btn=document.createElement('button');
  btn.id='glimDashBtn'; btn.textContent='📊 관리자용'; btn.onclick=open;
  btn.style.display='none'; /* 홈(메인) 화면에서만 노출 */
  document.body.appendChild(btn);
  window.__GLIM_DASH_VIS__=function(scr){btn.style.display=(scr==='home')?'':'none';};
  if(window.__GLIM_SCREEN__)window.__GLIM_DASH_VIS__(window.__GLIM_SCREEN__);
  var box=document.createElement('div'); box.id='glimDash';
  document.body.appendChild(box);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
})();

</script>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:820}}">

class Component extends DCLogic {
  state = { screen:'splash', nation:'단어나라', stageIdx:0, stars:3, score:'0',
    progress:{'단어나라':{unlocked:1,stars:{}},'음절나라':{unlocked:1,stars:{}},'음소나라':{unlocked:1,stars:{}}} };

  componentDidMount(){
    window.__GLIM_SCREEN__ = this.state.screen;
    if (window.__GLIM_DASH_VIS__) window.__GLIM_DASH_VIS__(this.state.screen);
    /* [GLIM_M] 브리지: 데모 데이터가 앱 진행도에 즉시 반영되도록 */
    window.__GLIM_SETPROG__ = (nation, obj) => {
      this.setState(st => {
        const p = JSON.parse(JSON.stringify(st.progress));
        if (!p[nation]) return {};
        if (obj.unlocked != null) p[nation].unlocked = obj.unlocked;
        if (obj.stars) p[nation].stars = obj.stars;
        this.saveProgress(p);
        return { progress: p };
      });
    };
    try{
      const raw = localStorage.getItem('glim_app_prog_v172');
      if(raw){ const p = JSON.parse(raw); if(p && p['단어나라'] && p['음절나라'] && p['음소나라']) this.setState({ progress:p }); }
    }catch(e){}
  }
  saveProgress(p){ try{ localStorage.setItem('glim_app_prog_v172', JSON.stringify(p)); }catch(e){} }

  go(screen, extra){ this.setState(Object.assign({ screen }, extra || {}));
    /* [GLIM_M] 관리자 버튼은 홈(메인)에서만 노출 */
    window.__GLIM_SCREEN__ = screen;
    if (window.__GLIM_DASH_VIS__) window.__GLIM_DASH_VIS__(screen);
  }

  // 화면이 바뀌면 스크롤을 맨 위로 — 이전 화면의 스크롤이 남아
  // 다음 화면 요소들이 위로 밀려 보이는 현상 방지
  componentDidUpdate(prevProps, prevState){
    if (prevState && prevState.screen !== this.state.screen) {
      window.scrollTo(0, 0);
    }
  }

  renderVals(){
    const s = this.state;
    // 게임에서 단계 완료 시: 별 저장 + ⭐⭐ 이상이면 다음 단계 해금
    const finish = (res) => {
      const stars = (res && res.stars) || 1;
      const score = (res && res.score) || 0;
      this.setState(st => {
        const p = JSON.parse(JSON.stringify(st.progress));
        const pn = p[st.nation];
        pn.stars[st.stageIdx] = Math.max(pn.stars[st.stageIdx] || 0, stars);
        /* [GLIM_M v1.7.2] 단어나라: 진급 = 완주만(별 무관), 상한 35. 타 나라 원본 유지 */
        const _isW = (st.nation === '단어나라' && window.GLIM_M);
        const _cap = _isW ? GLIM_M.STAGES.length : 10;
        const _need = _isW ? 1 : 2;
        if (stars >= _need) pn.unlocked = Math.max(pn.unlocked, Math.min(_cap, st.stageIdx + 2));
        this.saveProgress(p);
        return { screen:'result', stars, score: score.toLocaleString(), progress: p };
      });
    };
    return {
      isSplash: s.screen === 'splash',
      isHome:   s.screen === 'home',
      isNation: s.screen === 'nation',
      isAnimal: s.screen === 'animal',
      isStage:  s.screen === 'stage',
      isPlay:   s.screen === 'play',
      isResult: s.screen === 'result',
      nation: s.nation, stars: s.stars, score: s.score,
      stageIdx: s.stageIdx,
      stageLabel: s.nation + ' ' + (s.stageIdx + 1) + '단계',
      unlocked: s.progress[s.nation].unlocked,
      starsMap: s.progress[s.nation].stars,
      progWord: s.progress['단어나라'],
      progSyl: s.progress['음절나라'],
      progPho: s.progress['음소나라'],

      goHome:          () => this.go('home'),
      goNation:        () => this.go('nation'),
      goAnimal:        () => this.go('animal'),
      goStageWord:     () => this.go('stage', { nation:'단어나라' }),
      goStageSyllable: () => this.go('stage', { nation:'음절나라' }),
      goStagePhoneme:  () => this.go('stage', { nation:'음소나라' }),
      backHome:        () => this.go('home'),
      backNation:      () => this.go('nation'),
      backStage:       () => this.go('stage'),
      openPlay:        (i) => this.go('play', { stageIdx: (typeof i === 'number') ? i : s.stageIdx }),
      finish,
      retry:           () => this.go('play'),
      next:            () => this.go('stage'),
    };
  }
}

</script>
